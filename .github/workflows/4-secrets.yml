name: 4 Secrets
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  secrets-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use variable
        run: echo "Variable is ${{ vars.MY_VAR }}"

      - name: Use secret (it will be masked)
        env:
          MY_SECRET: ${{ secrets.MY_SECRET }}
        run: |
          echo "Secret is $MY_SECRET"
          echo "Secret length is ${#MY_SECRET}"

      - name: Use GITHUB_TOKEN for a REST API call
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }} | head -n 8

      - name: Create an issue with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue create --title "Created by workflow" --body "This issue was made using GITHUB_TOKEN"

      - name: Git operation
        run: git log -1 --oneline